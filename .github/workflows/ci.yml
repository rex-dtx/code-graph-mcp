name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Full matrix: 3 OSes × 2 feature combos.
  # Catches platform-specific issues (Windows path separators, macOS linker
  # differences, sqlite-vec C compilation variance) that used to ship silently
  # because CI only ran on ubuntu-latest while release.yml builds 5 platform
  # binaries. Toolchain is pinned for reproducibility (memory:
  # feedback_ship_baseline_and_flakes).
  check:
    name: Check & Test (${{ matrix.os }}, ${{ matrix.feature-label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Only the FTS5-only default here (Cargo.toml `default = []`). The previous
        # `""` ("with-embed") leg built the EMPTY default — feature-identical to
        # --no-default-features, so embed-model never actually compiled in CI. Real
        # embed coverage now lives in the dedicated `embed-check` job below.
        feature-flag: ["--no-default-features"]
        include:
          - feature-flag: "--no-default-features"
            feature-label: "no-embed"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.feature-label }}

      - name: Check
        run: cargo check ${{ matrix.feature-flag }}

      - name: Clippy
        run: cargo clippy ${{ matrix.feature-flag }} -- -D warnings

      - name: Test
        run: cargo test ${{ matrix.feature-flag }}

  # The shipped binary is built `--features embed-model` (release.yml), but the
  # matrix above only exercises the FTS5-only default — so a regression in the
  # Candle / embedding / vector-search path passed CI and was caught only by the
  # post-publish smoke-verify (after npm publish). Compile + clippy + test the
  # embed feature once on Linux to catch it pre-merge. Embed unit tests use
  # synthetic-weight seams (blake3 of fake bytes), so NO model download is needed.
  # Linux-only keeps the heavy Candle compile to a single runner.
  embed-check:
    name: Check & Test (ubuntu-latest, with-embed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-latest-with-embed

      - name: Check
        run: cargo check --features embed-model

      - name: Clippy
        run: cargo clippy --features embed-model -- -D warnings

      - name: Test
        run: cargo test --features embed-model

  # Plugin/lifecycle/release-smoke tests are Node-based and OS-independent —
  # run once on Linux to avoid the 3× matrix blow-up.
  plugin-tests:
    name: Plugin & Lifecycle Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Plugin lifecycle tests
        # Note: this curated list is not the full set of *.test.js under
        # claude-plugin/scripts/ — only tests verified to pass in CI without
        # local dev setup. hooks.test.js / pre-edit-guide.test.js were added
        # in v0.31.2 after the matcher-regression bug; future additions
        # should be vetted locally first, not blind-globbed.
        # pre-grep-guide.test.js + cg-answer.test.js added in v0.47.0
        # (deny-with-answer); vetted locally — node-only, stub binary via
        # _CG_ANSWER_BINARY, tmpdir fixtures, no cargo build required.
        # covering-tests.test.js added with edit-time covering-test targeting;
        # vetted locally — pure node, no binary/cargo.
        # doctor.test.js + scripts/sync-versions.test.js added in v0.49.1
        # (surveyHookCoverage moved to lifecycle.js); vetted locally — doctor
        # is fixture-only; sync-versions stubs builds via SYNC_VERSIONS_SKIP_BUILD
        # except one test that expects `cargo build` to fail (cargo ships on
        # ubuntu-latest runners).
        # pr-impact-comment.test.js added in v0.53.0; vetted locally — node-only,
        # stub binary via _CG_REVIEW_BINARY shim, tmpdir fixtures, no cargo build.
        #
        # v0.56.2 batch (close the CI/pre-commit coverage gap — most Node tests
        # ran only via the pre-commit hook, invisible to a CI-only contributor).
        # All vetted by READING each test (a local pass is a weak signal because
        # the dev box has target/release/code-graph-mcp, which CI does not):
        #   adopt              — pure logic + mkdtemp sandboxes (memoryDir slug,
        #                        sentinel heal, detectProjectType); no binary/net.
        #   claude-config      — pure CLAUDE_CONFIG_DIR env-var resolution.
        #   find-binary        — fixtures + process.execpath/shell-script fake
        #                        binaries; the one "no platform pkg" test self-
        #                        skips if a real global install is present, and
        #                        asserts null on a clean runner. `npm root -g`
        #                        is local (no network); npm ships with node.
        #   incremental-index  — shouldRun() env logic + a node-only default-OFF
        #                        spawn; two binary-spawn tests do `if (!findBinary())
        #                        return` and skip on CI (no target/release binary).
        #   pre-read-guide     — fanout state machine + tmpdir; answer stub via
        #                        _CG_ANSWER_BINARY, never the real binary.
        #   project-detect     — isProjectRoot/isNonProjectCwd over tmpdir markers.
        #   recommendation-log — JSONL append/rotate in a tmpdir .code-graph/.
        #   tmp-dir            — cgTmpDir() path + mkdir under os.tmpdir().
        #   user-prompt-context— intent/symbol regex + one CODE_GRAPH_QUIET_HOOKS=1
        #                        node-only spawn; reads committed skills/*.md.
        #   version-utils      — readBinaryVersion/isDevMode/getNewestMtime over
        #                        shell-script fakes + tmpdir; no real binary.
        #
        # Still OUT of CI (need a built binary, network, or local install state):
        #   scripts/install-e2e.test.js — several tests need target/release/
        #     code-graph-mcp; gate is pre-commit, which runs it whenever
        #     claude-plugin/ or scripts/ JS is staged (it went stale for 3 months
        #     when neither gate ran it).
        #   mcp-launcher.test.js — its dedup-stub test depends on the repo-root
        #     .mcp.json, which is gitignored (a dev-only file registering
        #     code-graph-dev for local metrics) and so absent on a CI checkout;
        #     without it the launcher falls through to findBinary()→null and the
        #     60s npm-install + 90s GitHub-download fallbacks, hanging the test.
        #
        # --test-concurrency=1: run the files serially. cg-answer + find-binary
        # both touch find-binary's on-disk resolution cache / the _CG_ANSWER_BINARY
        # env; under default per-file parallelism that cross-process state races and
        # cg-answer's binary-resolution test flakes intermittently. Serial is
        # deterministic and the suite is fast (~15s).
        run: node --test --test-concurrency=1 claude-plugin/scripts/lifecycle.test.js claude-plugin/scripts/lifecycle.e2e.test.js claude-plugin/scripts/auto-update.test.js claude-plugin/scripts/session-init.test.js claude-plugin/scripts/statusline.test.js claude-plugin/scripts/hooks.test.js claude-plugin/scripts/pre-edit-guide.test.js claude-plugin/scripts/covering-tests.test.js claude-plugin/scripts/pre-grep-guide.test.js claude-plugin/scripts/cg-answer.test.js claude-plugin/scripts/doctor.test.js claude-plugin/scripts/pr-impact-comment.test.js claude-plugin/scripts/adopt.test.js claude-plugin/scripts/claude-config.test.js claude-plugin/scripts/find-binary.test.js claude-plugin/scripts/incremental-index.test.js claude-plugin/scripts/pre-read-guide.test.js claude-plugin/scripts/project-detect.test.js claude-plugin/scripts/recommendation-log.test.js claude-plugin/scripts/tmp-dir.test.js claude-plugin/scripts/user-prompt-context.test.js claude-plugin/scripts/version-utils.test.js scripts/release-smoke.test.js scripts/sync-versions.test.js

  # Supply-chain CVE scan over Cargo.lock (376 transitive deps including the
  # Candle ML stack). cargo-audit reads RustSec advisories and exits non-zero
  # on any vulnerability — keeps CVE coverage continuous instead of a one-time
  # review. Independent of the check-and-test matrix because it scans
  # Cargo.lock content, not build output.
  #
  # Pinned to cargo-audit ^0.22 because 0.21.x panics on RustSec advisories
  # using CVSS 4.0 (e.g. RUSTSEC-2026-0066) — the fetch fails before any
  # finding can be reported.
  #
  # No `--deny warnings`: vulnerabilities fail the run by default; informational
  # advisories (`unmaintained`, `unsound`) print but don't block — most are
  # transitive and not under our control until upstream replacements ship.
  audit:
    name: Cargo Audit (supply-chain CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-audit
      - name: Install cargo-audit
        run: cargo install --locked --version ^0.22 cargo-audit
      - name: Run cargo audit
        run: cargo audit
